# Publishes the voice bench (index.html + JS) to GitHub Pages on every push
# to main. One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect the site files
        run: |
          mkdir site
          cp -r index.html app.js worklet.js cache-worker.js dsp voices cache site/
          mkdir site/elixir && cp -r elixir/index.html elixir/help.html elixir/manifest.webmanifest elixir/sw.js elixir/icons elixir/irs site/elixir/
          # Elixir 808's version, 1.N: N the number of changes merged into main
          VER="1.$(git rev-list --count --first-parent HEAD)"
          sed -i "s#<!--v-->[^<]*<!--/v-->#<!--v-->$VER<!--/v-->#g" site/elixir/index.html
          grep -c "<!--v-->$VER" site/elixir/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes the same site as pages.yml to Cloudflare Pages (https://808sc.pages.dev/, project 808sc) with wrangler,
# when run by hand from the Actions tab (not on push for now: deploys go out with wrangler from Johnny's Mac).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped.
name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: .github/scripts/site.sh
      - name: No Cloudflare secrets yet
        if: env.CF_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID aren't set; skipping the Cloudflare deploy"
      - name: Deploy with wrangler
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.0'
          # (creates the project the first time; afterwards that step just reports it exists)
          preCommands: npx wrangler pages project create 808sc --production-branch main || true
          command: pages deploy site --project-name 808sc --branch main --commit-dirty=true

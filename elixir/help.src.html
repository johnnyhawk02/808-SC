<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>808 SC help</title>
<meta name="theme-color" content="#a7b58c">
<style>
  :root { --panel: #a7b58c; --ink: #17200e; --muted: rgba(23, 32, 14, .68); --line: rgba(23, 32, 14, .22); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d2216; color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, Roboto, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .lcd { background: var(--panel); border-radius: 10px; padding: 18px 18px 8px; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .35); }
  h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -.01em; }
  h2 { margin: 22px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; }
  p, li { margin: 0 0 8px; }
  ul { padding-left: 20px; margin: 0 0 8px; }
  b { font-weight: 400; text-transform: uppercase; background: var(--ink); color: var(--panel); padding: 0 4px; border-radius: 2px; }
  .lead { color: var(--muted); }
  a { color: var(--ink); }
  .back { display: inline-block; margin: 16px 0 6px; font-size: 1.2rem; }
</style>
</head>
<body>
<main>
<div class="lcd">
  <h1>808 SC <small>v@VER@</small></h1>
  <p class="lead">The sixteen TR-808 sounds as circuit simulations, cached hits or synthetic models, with a pattern grid, a generator, effects and a mixer. The same help is in the app: options › help, or press ?.</p>

  <!--@HELP@-->

  <a class="back" href="./">&larr; back to 808 SC</a>
</div>
</main>
</body>
</html>
